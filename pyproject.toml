[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrazer-win"
version = "0.1.0"
description = "Windows utility for configuring Razer mice without the vendor software"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gavin Viney" }]
keywords = ["razer", "hid", "mouse", "dpi", "openrazer", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "hid>=1.0.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.scripts]
openrazer-win = "openrazer_win.cli:main"

[project.gui-scripts]
openrazer-win-gui = "openrazer_win.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
